project: ros2-desktop

path: /home/ubuntu/project

# The ros2-desktop SDK installs ros-*-desktop-full (~2GB of packages),
# which exceeds spread's default 15m kill-timeout.
warn-timeout: 10m
kill-timeout: 45m

backends:
  lxd:
    systems:
      - ubuntu-24.04:
          username: ubuntu
          vm: true
          storage: 50G
          memory: 16G

suites:
  main/:
    summary: Test the ros2-desktop SDK inside workshops
    environment:
      BASE: ubuntu@26.04
      ROS_DISTRO: lyrical
